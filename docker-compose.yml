services:
  app:
    build: .
    env_file: .env
    environment:
      APP_ENV: production
      SQLITE_PATH: /app/data/chat.db
      KNOWLEDGE_DIR: /app/knowledge
    ports:
      - "8000:8000"
    volumes:
      # Edit knowledge files on the host; the app reloads them without a restart.
      - ./knowledge:/app/knowledge:ro
      # SQLite database and NiceGUI per-browser storage.
      - chat-data:/app/data
    restart: unless-stopped

volumes:
  chat-data:
